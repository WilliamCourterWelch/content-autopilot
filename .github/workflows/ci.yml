name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install python-dotenv requests beautifulsoup4
      - name: Unit tests
        run: python3 -m pytest tests/ -q
      - name: AI lane dry-run (no secrets)
        run: python3 run.py --ai-lane --formats audio,report,infographic --limit 1 --dry-run
